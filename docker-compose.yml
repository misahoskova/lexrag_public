services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./app/src:/app/src
      - ./app/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - localnet

  db:
    build: ./db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - localnet

  pgadmin:
    container_name: "pgadmin4"
    depends_on:
      db:
        condition: service_healthy
    build:
      dockerfile: pgadmin/Dockerfile
    restart: always
    env_file: .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=$PGADMIN_DEFAULT_EMAIL
      - PGADMIN_DEFAULT_PASSWORD=$PGADMIN_DEFAULT_PASSWORD
    ports:
      - "8888:80"
    volumes:
      - ./pgadmin/volume:/var/lib/pgadmin

networks:
  localnet:
    driver: bridge

volumes:
  db_data:
